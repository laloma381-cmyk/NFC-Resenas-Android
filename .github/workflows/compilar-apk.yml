name: Compilar y probar ReviewQR Manager

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-mvp
      - design/reviewqr-professional

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Ejecutar pruebas unitarias y compilar APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: ReviewQR-Manager-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
